<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: sans-serif; background: #eee; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .slide { background: #fff; padding: 10px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
        img { display: block; max-width: 900px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Playfair Course Screenshots</h1>
    <div id="gallery"></div>
    <script>
        const gallery = document.getElementById('gallery');
        for (let i = 1; i <= 75; i++) {
            const div = document.createElement('div');
            div.className = 'slide';
            div.innerHTML = `<h2>Slide ${i}</h2><img src="slide_${i}.png" onerror="this.parentElement.style.display='none'">`;
            gallery.appendChild(div);
        }
    </script>
</body>
</html>
